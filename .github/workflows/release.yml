name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0). Leave empty to use package.json version.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright FFmpeg (video recording)
        run: npx playwright install ffmpeg

      - name: Build web assets
        run: npm run build:web

      - name: Package desktop installer
        # --publish never: tag pushes would otherwise make electron-builder try GitHub publish and require GH_TOKEN.
        # Softprops uploads the installer in a later step with GITHUB_TOKEN.
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
        env:
          # Skip code signing on CI unless secrets are provided
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"
          ls -la release/desktop-package-ready || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoTest-Studio-Windows-x64
          path: |
            release/desktop-package-ready/*.exe
            release/desktop-package-ready/*.yml
            release/desktop-package-ready/*.yaml
            release/desktop-package-ready/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: AutoTest Studio ${{ steps.meta.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            release/desktop-package-ready/*.exe
            release/desktop-package-ready/*.blockmap
            release/desktop-package-ready/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
